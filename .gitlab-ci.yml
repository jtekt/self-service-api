stages:
  - build
  - deploy

variables:
  APPLICATION_NAME: self-service-api
  CONTAINER_IMAGE_NAME: ${APPLICATION_NAME}
  CONTAINER_IMAGE: ${AWS_ECR_PUBLIC_URL}/${CONTAINER_IMAGE_NAME}
  CONTAINER_IMAGE_TAGGED: ${CONTAINER_IMAGE}:${CI_COMMIT_SHORT_SHA}
  K8S_NAMESPACE: self-service-suite

build:
  stage: build
  tags:
    - docker
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    # Create the ECR repository if it does not exist yet
    - >
      aws ecr-public create-repository --region us-east-1 --repository-name ${CONTAINER_IMAGE_NAME}
      || echo "Repository might have already existed"
  script:
    - docker build -t ${CONTAINER_IMAGE_TAGGED} .
    - docker push ${CONTAINER_IMAGE_TAGGED}

deploy:
  stage: deploy
  tags:
    - docker
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - kubectl config use-context eks-internal-public/gitlab-agent-for-kubernetes:eks-internal-public
    - kubectl config set-context --current --namespace=${K8S_NAMESPACE}
    - envsubst < kubernetes_manifest.yml | kubectl apply -f -
