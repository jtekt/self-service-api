apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${K8S_SERVICE_ACCOUNT}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${APPLICATION_NAME}
  annotations:
    deployment-manager.jtekt.co.jp/users: ${GITLAB_USER_EMAIL}
    deployment-manager.jtekt.co.jp/repository.url: ${CI_PROJECT_URL}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${APPLICATION_NAME}
  template:
    metadata:
      labels:
        app: ${APPLICATION_NAME}
    spec:
      serviceAccountName: ${K8S_SERVICE_ACCOUNT}
      containers:
        - name: ${APPLICATION_NAME}
          image: ${CONTAINER_IMAGE_TAGGED}
          env:
            - name: PGRST_IMAGE
              value: postgrest/postgrest
            - name: PGRST_JWT_CERT_URL
              value: https://keycloak.jtektrdmc.io/realms/jtekt/protocol/openid-connect/certs
            - name: PGRST_JWT_CLAIM_KEY
              value: email
            - name: DEFAULT_HOST
              value: pooler-rw-transaction.public
            - name: DEFAULT_PORT
              value: "5432"
            - name: DEFAULT_READ_ONLY
              value: "true"
            - name: DATABASE_NAME_PREFIX
              value: api
            - name: K8S_NAMESPACE
              value: ${K8S_APPS_NAMESPACE}
            - name: DEPLOY_MODE
              value: ingress
            - name: DEPLOY_PROTOCOL
              value: http
            - name: INGRESS_DOMAIN
              value: higashikariya.jtektrnd.net
            - name: AUTH_KEYCLOAK_ID
              value: public
            - name: AUTH_KEYCLOAK_ISSUER
              value: https://keycloak.jtektrdmc.io/realms/jtekt
            - name: AUTH_URL
              value: https://self-service-api.higashikariya.jtektrnd.net
            - name: AUTH_TRUST_HOST
              value: "true"
            - name: MESSAGE
              value: Database credentials can be generated in <a target="_blank" href="http://self-service-db.higashikariya.jtektrnd.net"><u><strong>Self-service DB</strong></u></a>. Use those credentials when connecting your database in the self-service form
          envFrom:
            - secretRef:
                name: $K8S_ENV_NAME
          resources:
            requests:
              memory: "128Mi"
              cpu: "10m"
            limits:
              memory: "512Mi"
              cpu: "600m"
      imagePullSecrets:
        - name: ${K8S_ECR_SECRET_NAME}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: self-service-api-role
  namespace: ${K8S_APPS_NAMESPACE}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "delete", "get", "list", "watch", "update", "patch"]

  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "delete", "get", "list", "watch", "update", "patch"]

  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["create", "delete", "get", "list", "watch", "update", "patch"]

  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete", "get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: self-service-api-rolebinding
  namespace: ${K8S_APPS_NAMESPACE}
subjects:
  - kind: ServiceAccount
    name: ${K8S_SERVICE_ACCOUNT}
    namespace: ${K8S_NAMESPACE}
roleRef:
  kind: Role
  name: self-service-api-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: ${APPLICATION_NAME}
  labels:
    app: ${APPLICATION_NAME}
spec:
  type: ClusterIP
  selector:
    app: ${APPLICATION_NAME}
  ports:
    - port: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${APPLICATION_NAME}
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Self-Service Suite
    gethomepage.dev/name: Self-service API
    gethomepage.dev/description: Allows users to create API from a PostgreSQL on their own
    gethomepage.dev/icon: https://gitlab.jtektrnd.net/uploads/-/system/project/avatar/3714/self-service-api.png
    gethomepage.dev/pod-selector: app=${APPLICATION_NAME}

    cert-manager.io/cluster-issuer: letsencrypt

spec:
  ingressClassName: public
  tls:
    - hosts:
        - self-service-api.higashikariya.jtektrnd.net
      secretName: self-service-api-tls

  rules:
    - host: self-service-api.higashikariya.jtektrnd.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ${APPLICATION_NAME}
                port:
                  number: 3000
