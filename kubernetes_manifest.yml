apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${K8S_SERVICE_ACCOUNT}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${APPLICATION_NAME}
  annotations:
    users: "kevin_fabel@jtekt.co.jp"
    repository.url: ${CI_PROJECT_URL}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${APPLICATION_NAME}
  template:
    metadata:
      labels:
        app: ${APPLICATION_NAME}
    spec:
      serviceAccountName: ${K8S_SERVICE_ACCOUNT}
      containers:
        - name: ${APPLICATION_NAME}
          image: ${CONTAINER_IMAGE_TAGGED}
          env:
            - name: PGRST_IMAGE
              value: postgrest/postgrest
            - name: PGRST_JWT_CERT_URL
              value: http://10.115.1.100:30416/realms/jtekt/protocol/openid-connect/certs
            - name: PGRST_JWT_CLAIM_KEY
              value: email
            - name: DEFAULT_HOST
              value: pooler-rw-transaction.public
            - name: DEFAULT_PORT
              value: "5432"
            - name: DEFAULT_READ_ONLY
              value: true
            - name: DATABASE_NAME_PREFIX
              value: api
            - name: K8S_NAMESPACE
              value: ${K8S_APPS_NAMESPACE}
            - name: DEPLOY_MODE
              value: nodePort
            - name: DEPLOY_PROTOCOL
              value: http
            - name: NODEPORT_EXTERNAL_ADDRESS
              value: 172.16.98.151
          resources:
            requests:
              memory: "128Mi"
              cpu: "10m"
            limits:
              memory: "512Mi"
              cpu: "600m"
      imagePullSecrets:
        - name: ${K8S_ECR_SECRET_NAME}
---
apiVersion: v1
kind: Service
metadata:
  name: ${APPLICATION_NAME}
  labels:
    app: ${APPLICATION_NAME}
spec:
  type: NodePort
  selector:
    app: ${APPLICATION_NAME}
  ports:
    - port: 3000
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: self-service-api-role
  namespace: ${K8S_APPS_NAMESPACE}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "delete", "get", "list", "watch", "update", "patch"]
    
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "delete", "get", "list", "watch", "update", "patch"]

  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["create", "delete", "get", "list", "watch", "update", "patch"]

  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete", "get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: self-service-api-rolebinding
  namespace: ${K8S_APPS_NAMESPACE}
subjects:
  - kind: ServiceAccount
    name: ${K8S_SERVICE_ACCOUNT}
    namespace: ${K8S_NAMESPACE}
roleRef:
  kind: Role
  name: self-service-api-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${APPLICATION_NAME}
spec:
  rules:
    - host: self-service-api.higashikariya.jtektrnd.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ${APPLICATION_NAME}
                port:
                  number: 3000
